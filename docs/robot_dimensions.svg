<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328">
  <title>herover dimensions: wheel diameter A, wheelbase B, track width C</title>
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#b42318"/></marker>
    <marker id="half" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#6b4fa0"/></marker>
    <marker id="axis" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b62c4"/></marker>
    <clipPath id="tyre"><rect x="-22" y="-50" width="44" height="100" rx="5"/></clipPath>
    <!-- Wheel centred on 0,0. Rollers as seen from above on FL and RR. -->
    <g id="wheel">
      <rect x="-22" y="-50" width="44" height="100" rx="5" fill="#d6dade"/>
      <g clip-path="url(#tyre)" stroke="#57606a" stroke-width="5">
        <path d="M-26 -92 l52 52 M-26 -73 l52 52 M-26 -54 l52 52 M-26 -35 l52 52 M-26 -16 l52 52 M-26 3 l52 52 M-26 22 l52 52 M-26 41 l52 52"/>
      </g>
      <rect x="-22" y="-50" width="44" height="100" rx="5" fill="none" stroke="#1f2328" stroke-width="2"/>
      <circle r="4" fill="#b42318"/>
    </g>
  </defs>
  <rect width="860" height="540" rx="8" fill="#ffffff"/>

  <!-- top view -->
  <text x="300" y="30" text-anchor="middle" font-weight="bold">Robot, seen from above</text>
  <rect x="200" y="112" width="200" height="356" rx="12" fill="#f3f5f7" stroke="#1f2328" stroke-width="2"/>
  <text x="300" y="138" text-anchor="middle" font-weight="bold">FRONT</text>
  <g stroke="#8c959f" stroke-dasharray="6 4">
    <path d="M170 170 H430 M170 410 H430 M170 290 H430 M300 150 V456"/>
  </g>
  <use href="#wheel" transform="translate(170 170)"/>
  <use href="#wheel" transform="translate(430 170) scale(-1 1)"/>
  <use href="#wheel" transform="translate(170 410) scale(-1 1)"/>
  <use href="#wheel" transform="translate(430 410)"/>
  <g font-weight="bold">
    <text x="138" y="165" text-anchor="end">FL</text><text x="138" y="405" text-anchor="end">RL</text>
    <text x="462" y="160">FR</text><text x="462" y="400">RR</text>
  </g>
  <g font-size="13" fill="#57606a">
    <text x="138" y="183" text-anchor="end">motor ID 3</text><text x="138" y="423" text-anchor="end">motor ID 1</text>
    <text x="462" y="190">motor ID 4</text><text x="462" y="430">motor ID 2</text>
  </g>

  <!-- body axes -->
  <g stroke="#0b62c4" stroke-width="3" fill="none">
    <path d="M300 290 V204" marker-end="url(#axis)"/>
    <path d="M300 290 H226" marker-end="url(#axis)"/>
    <path d="M290 246 A45 45 0 0 0 256 280" stroke-width="2" marker-end="url(#axis)"/>
  </g>
  <circle cx="300" cy="290" r="5" fill="#0b62c4"/>
  <g fill="#0b62c4" font-size="14">
    <text x="293" y="202" text-anchor="end">x forward</text>
    <text x="210" y="311">y left</text>
    <text x="266" y="252" text-anchor="end">wz CCW</text>
  </g>

  <!-- half dimensions used by the firmware -->
  <g stroke="#6b4fa0" stroke-width="2" fill="none">
    <path d="M340 290 V170" marker-start="url(#half)" marker-end="url(#half)"/>
    <path d="M300 340 H430" marker-start="url(#half)" marker-end="url(#half)"/>
    <path d="M430 340 V290" stroke-width="1" stroke="#8c959f"/>
  </g>
  <g fill="#6b4fa0" font-size="14">
    <text x="347" y="235">lx</text>
    <text x="347" y="252">B / 2</text>
    <text x="350" y="359" text-anchor="middle">ly = C / 2</text>
  </g>

  <!-- B and C -->
  <g stroke="#b42318" fill="none">
    <path d="M170 116 V62 M430 116 V62 M456 170 H558 M456 410 H558"/>
    <path d="M170 72 H430" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <path d="M548 170 V410" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  </g>
  <g fill="#b42318" font-weight="bold" font-size="17">
    <text x="300" y="62" text-anchor="middle">C: track width</text>
    <text x="560" y="286">B:</text>
    <text x="560" y="306">wheelbase</text>
  </g>
  <text x="300" y="505" text-anchor="middle" font-size="13" fill="#57606a">Wheel centre = middle of its width. Rollers on top point to the robot centre (X).</text>

  <!-- wheel side view -->
  <text x="740" y="30" text-anchor="middle" font-weight="bold">Wheel, side view</text>
  <path d="M655 192 H845" stroke="#57606a" stroke-width="2"/>
  <circle cx="725" cy="132" r="60" fill="#d6dade" stroke="#1f2328" stroke-width="2"/>
  <circle cx="725" cy="132" r="36" fill="#f3f5f7" stroke="#1f2328" stroke-width="2"/>
  <circle cx="725" cy="132" r="4" fill="#b42318"/>
  <g stroke="#b42318" fill="none">
    <path d="M725 72 H815"/>
    <path d="M805 72 V192" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  </g>
  <text x="815" y="138" fill="#b42318" font-weight="bold" font-size="17">A</text>
  <text x="740" y="216" text-anchor="middle" font-size="13" fill="#57606a">ground</text>
  <text x="740" y="240" text-anchor="middle" font-weight="bold" font-size="17" fill="#b42318">A: wheel diameter</text>
  <text x="740" y="260" text-anchor="middle" font-size="13" fill="#57606a">outside of the rollers</text>
</svg>
